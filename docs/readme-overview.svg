<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Sleep Fingerprint research story</title>
  <desc id="desc">An under-mattress BCG signal contains repeatable identity information across nights, but time and setup confounds remain strong, so the hardware verdict is not yet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .eyebrow { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: 1.5px; fill: #8b949e; }
      .card-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .body { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c9d1d9; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .metric-blue { font: 800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #58a6ff; }
      .metric-green { font: 800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #3fb950; }
      .metric-warn { font: 800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #d29922; }
      .verdict { font: 800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .badge { font: 800 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #e3b341; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>

  <text x="60" y="62" class="title">Can your bed recognize you while you sleep?</text>
  <text x="60" y="94" class="subtitle">Public-data proof of concept: signal → identity evidence → confound test → hardware decision</text>

  <!-- Card 1: sensor -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="315" height="340" rx="22" fill="#161b22" stroke="#30363d"/>
  </g>
  <text x="82" y="171" class="eyebrow">1 · MEASURE</text>
  <text x="82" y="205" class="card-title">Under-mattress BCG</text>

  <!-- bed icon -->
  <rect x="84" y="246" width="232" height="62" rx="10" fill="#21262d" stroke="#484f58"/>
  <rect x="96" y="227" width="76" height="30" rx="12" fill="#30363d"/>
  <rect x="84" y="306" width="12" height="40" rx="4" fill="#484f58"/>
  <rect x="304" y="306" width="12" height="40" rx="4" fill="#484f58"/>
  <rect x="159" y="318" width="82" height="10" rx="5" fill="#58a6ff"/>
  <text x="200" y="355" class="small" text-anchor="middle">piezo film sensor</text>

  <!-- signal waveform -->
  <path d="M83 399 C99 399 102 382 112 399 S128 417 139 399 S155 377 167 399 S183 430 198 399 S214 365 229 399 S246 421 260 399 S278 385 291 399 S305 414 318 399" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="438" class="body">Tiny body vibrations carry</text>
  <text x="82" y="460" class="body">cardiac + respiratory structure.</text>

  <!-- Arrow 1 -->
  <line x1="390" y1="305" x2="430" y2="305" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Card 2: evidence -->
  <g filter="url(#shadow)">
    <rect x="445" y="135" width="315" height="340" rx="22" fill="#161b22" stroke="#30363d"/>
  </g>
  <text x="472" y="171" class="eyebrow">2 · TEST</text>
  <text x="472" y="202" class="card-title">Identity survives</text>
  <text x="472" y="226" class="card-title">held-out nights</text>
  <text x="472" y="270" class="metric-green">25.0%</text>
  <text x="472" y="294" class="body">Rank-1 identification</text>
  <text x="472" y="317" class="small">vs 3.1% chance · 32 people · 212 nights</text>
  <line x1="472" y1="338" x2="733" y2="338" stroke="#30363d"/>
  <text x="472" y="381" class="metric-blue">0.817</text>
  <text x="472" y="405" class="body">verification AUROC</text>
  <text x="472" y="438" class="body">Same-person similarity: <tspan font-weight="700" fill="#f0f6fc">0.472</tspan></text>
  <text x="472" y="461" class="body">Different-person: <tspan font-weight="700" fill="#f0f6fc">−0.014</tspan></text>

  <!-- Arrow 2 -->
  <line x1="780" y1="305" x2="820" y2="305" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Card 3: confounds -->
  <g filter="url(#shadow)">
    <rect x="835" y="135" width="310" height="340" rx="22" fill="#161b22" stroke="#30363d"/>
  </g>
  <text x="862" y="171" class="eyebrow">3 · TRY TO BREAK IT</text>
  <text x="862" y="205" class="card-title">Setup + time still leak in</text>
  <text x="862" y="248" class="metric-warn">3.1%</text>
  <text x="862" y="272" class="body">early → late Rank-1</text>
  <text x="862" y="296" class="small">falls exactly to chance</text>
  <line x1="862" y1="322" x2="1118" y2="322" stroke="#30363d"/>
  <text x="862" y="365" class="metric-warn">48–57%</text>
  <text x="862" y="389" class="body">sensor-location prediction</text>
  <text x="862" y="413" class="small">vs 12.5% chance</text>
  <text x="862" y="449" class="body">Changed-location Rank-1: <tspan font-weight="700" fill="#f0f6fc">14.2%</tspan></text>

  <!-- Verdict strip -->
  <rect x="55" y="510" width="1090" height="108" rx="20" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <circle cx="103" cy="564" r="22" fill="#d29922" opacity="0.15"/>
  <path d="M103 549 L103 568 M103 580 L103 581" stroke="#d29922" stroke-width="5" stroke-linecap="round"/>
  <text x="144" y="542" class="eyebrow">CURRENT VERDICT</text>
  <text x="144" y="574" class="verdict">Promising biological signal.</text>
  <text x="144" y="602" class="verdict">Identity is not isolated from setup/time yet.</text>
  <rect x="932" y="538" width="182" height="52" rx="26" fill="#d29922" opacity="0.16" stroke="#d29922"/>
  <text x="1023" y="570" class="badge" text-anchor="middle">HARDWARE: NOT YET</text>
</svg>
