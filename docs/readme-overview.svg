<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sleep Fingerprint in plain English</title>
  <desc id="desc">A sensor under the mattress records tiny body vibrations. A computer can identify the sleeper better than random across different nights, but the result falls to random when tested farther apart in time. The project is promising research, but not ready for hardware.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <style>
      .title { font: 800 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .subtitle { font: 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #b1bac4; }
      .step { font: 800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; letter-spacing: 1.2px; }
      .h { font: 800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
      .body { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #c9d1d9; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #8b949e; }
      .biggood { font: 900 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #3fb950; }
      .bigbad { font: 900 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #d29922; }
      .verdict { font: 900 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f0f6fc; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#0d1117"/>

  <text x="60" y="58" class="title">Does your sleeping body have a fingerprint?</text>
  <text x="60" y="92" class="subtitle">The whole experiment, without the research jargon.</text>

  <!-- Step 1 -->
  <rect x="55" y="135" width="250" height="300" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="170" class="step">1 · YOU SLEEP</text>
  <rect x="82" y="221" width="195" height="54" rx="10" fill="#21262d" stroke="#484f58"/>
  <rect x="94" y="205" width="60" height="25" rx="10" fill="#30363d"/>
  <rect x="82" y="273" width="10" height="34" rx="3" fill="#484f58"/>
  <rect x="267" y="273" width="10" height="34" rx="3" fill="#484f58"/>
  <rect x="140" y="286" width="78" height="9" rx="4" fill="#58a6ff"/>
  <text x="179" y="321" class="small" text-anchor="middle">sensor under mattress</text>
  <path d="M82 354 C96 354 100 338 112 354 S133 372 147 354 S167 334 181 354 S201 374 217 354 S238 338 253 354 S267 365 278 354" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="395" class="body">It records tiny vibrations</text>
  <text x="80" y="419" class="body">from your heart + breathing.</text>

  <line x1="319" y1="285" x2="355" y2="285" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="370" y="135" width="250" height="300" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="395" y="170" class="step">2 · ASK A SIMPLE QUESTION</text>
  <text x="395" y="218" class="h">“Who is sleeping?”</text>
  <rect x="402" y="250" width="84" height="68" rx="14" fill="#21262d" stroke="#484f58"/>
  <circle cx="444" cy="271" r="11" fill="#8b949e"/>
  <path d="M422 304 Q444 282 466 304" fill="#8b949e"/>
  <text x="444" y="341" class="small" text-anchor="middle">Person A</text>
  <rect x="504" y="250" width="84" height="68" rx="14" fill="#21262d" stroke="#484f58"/>
  <circle cx="546" cy="271" r="11" fill="#8b949e"/>
  <path d="M524 304 Q546 282 568 304" fill="#8b949e"/>
  <text x="546" y="341" class="small" text-anchor="middle">Person B</text>
  <text x="395" y="382" class="body">Learn from earlier nights.</text>
  <text x="395" y="407" class="body">Guess on different nights.</text>

  <line x1="634" y1="285" x2="670" y2="285" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="685" y="135" width="250" height="300" rx="20" fill="#161b22" stroke="#30363d"/>
  <text x="710" y="170" class="step">3 · IT WORKS SOMEWHAT</text>
  <text x="710" y="237" class="biggood">1 in 4</text>
  <text x="710" y="266" class="body">nights identified correctly</text>
  <text x="710" y="305" class="small">Random guessing:</text>
  <text x="710" y="333" class="h">about 1 in 32</text>
  <text x="710" y="380" class="body">So the sleep signal really</text>
  <text x="710" y="405" class="body">does contain identity clues.</text>

  <line x1="949" y1="285" x2="985" y2="285" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="1000" y="135" width="145" height="300" rx="20" fill="#161b22" stroke="#d29922"/>
  <text x="1020" y="170" class="step">4 · BUT...</text>
  <text x="1020" y="237" class="bigbad">1 in 32</text>
  <text x="1020" y="268" class="body">on the harder</text>
  <text x="1020" y="292" class="body">early → late test.</text>
  <text x="1020" y="339" class="body">That is basically</text>
  <text x="1020" y="363" class="body">random again.</text>
  <text x="1020" y="407" class="small">Time / setup may</text>
  <text x="1020" y="427" class="small">be fooling us.</text>

  <!-- Bottom verdict -->
  <rect x="55" y="470" width="1090" height="105" rx="20" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="82" y="510" class="step">WHAT THIS MEANS</text>
  <text x="82" y="546" class="verdict">Interesting signal. Not proof of a stable biological fingerprint yet.</text>
  <rect x="896" y="493" width="220" height="55" rx="28" fill="#d29922" fill-opacity="0.14" stroke="#d29922"/>
  <text x="1006" y="528" class="h" text-anchor="middle" fill="#e3b341">HARDWARE: NOT YET</text>
</svg>
