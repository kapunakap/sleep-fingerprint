name: research-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data-structure-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/research-lock.txt
      - name: Install locked probe environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements/research-lock.txt
          python -m pip install h5py -c requirements/research-lock.txt
          python -m pip check
      - name: Inspect one PLOS multichannel participant file
        run: python scripts/probe_plos.py
      - name: Inspect independent transfer metadata
        run: python scripts/probe_transfer.py
