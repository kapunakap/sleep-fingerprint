name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/issue-1-poc-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev,encoder]'
      - run: pytest
      - run: ruff check src tests
      - run: mypy src
