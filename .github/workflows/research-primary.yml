name: research-primary

on:
  push:
    branches:
      - codex/issue-1-poc-experiment-evidence
    paths:
      - "src/sleep_fingerprint/primary_experiment.py"
      - "scripts/run_primary_experiments.py"
      - "tests/test_primary_experiment.py"
      - ".github/workflows/research-primary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  primary-cross-night:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and scientific-invariant tests
        run: pytest
      - name: Lint primary experiment code
        run: |
          ruff check \
            src/sleep_fingerprint/primary_experiment.py \
            scripts/run_primary_experiments.py \
            tests/test_primary_experiment.py
      - name: Type check
        run: mypy src
      - name: Disk before primary experiment
        run: df -h .
      - name: Run pinned 212-night primary experiment
        run: python scripts/run_primary_experiments.py
      - name: Commit measured primary results
        run: |
          git config user.name "sleep-fingerprint-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metrics/primary_cross_night plots/primary_cross_night
          if git diff --cached --quiet; then
            echo "No generated primary result changes"
          else
            git commit -m "results: reproduce primary cross-night control"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
