name: research-primary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-cross-night:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/research-lock.txt
      - name: Install locked CPU-only environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,encoder]" -c requirements/research-lock.txt
          python -m pip check
      - name: Unit and scientific-invariant tests
        run: pytest
      - name: Lint current tree
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src
      - name: Disk before primary experiment
        run: df -h .
      - name: Run pinned 212-night primary experiment
        run: python scripts/run_primary_experiments.py
      - uses: actions/upload-artifact@v4
        with:
          name: primary-cross-night-results
          if-no-files-found: error
          path: |
            metrics/primary_cross_night
            plots/primary_cross_night
