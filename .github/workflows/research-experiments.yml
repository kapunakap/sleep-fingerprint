name: research-experiments

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plos-cross-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/research-lock.txt
      - name: Install locked CPU-only environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,encoder]" -c requirements/research-lock.txt
          python -m pip check
      - name: Unit and scientific-invariant tests
        run: pytest
      - name: Lint experiment code
        run: |
          ruff check \
            src/sleep_fingerprint/experiment.py \
            src/sleep_fingerprint/manifest.py \
            src/sleep_fingerprint/plos_multichannel.py \
            tests/test_experiment.py \
            scripts/run_plos_cross_sensor.py
      - name: Type check
        run: mypy src
      - name: Run full public cross-sensor experiment
        run: python scripts/run_plos_cross_sensor.py
      - uses: actions/upload-artifact@v4
        with:
          name: plos-cross-sensor-results
          if-no-files-found: error
          path: |
            metrics/plos_cross_sensor
            plots/plos_cross_sensor
