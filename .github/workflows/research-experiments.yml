name: research-experiments

on:
  push:
    branches:
      - codex/issue-1-poc-experiment-evidence
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/run_plos_cross_sensor.py"
      - ".github/workflows/research-experiments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plos-cross-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and scientific-invariant tests
        run: pytest
      - name: Lint new experiment code
        run: |
          ruff check \
            src/sleep_fingerprint/experiment.py \
            src/sleep_fingerprint/manifest.py \
            src/sleep_fingerprint/plos_multichannel.py \
            tests/test_experiment.py \
            scripts/run_plos_cross_sensor.py
      - name: Type check
        run: mypy src
      - name: Run full public cross-sensor experiment
        run: python scripts/run_plos_cross_sensor.py
      - name: Commit measured public-data results
        run: |
          git config user.name "sleep-fingerprint-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metrics/plos_cross_sensor plots/plos_cross_sensor
          if git diff --cached --quiet; then
            echo "No generated result changes"
          else
            git commit -m "results: add measured PLOS cross-sensor evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
