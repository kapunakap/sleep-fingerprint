name: research-transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked CPU-only environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,encoder]" -c requirements/research-lock.txt
          python -m pip check
      - name: Scientific/software checks
        run: |
          pytest
          ruff check src tests scripts
          mypy src
          git diff --check
      - name: Run frozen independent-domain transfer
        run: python scripts/run_transfer.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-transfer-results
          if-no-files-found: error
          path: |
            metrics/transfer_28643153
            plots/transfer_28643153
