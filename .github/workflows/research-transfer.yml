name: research-transfer

on:
  push:
    branches:
      - codex/issue-1-poc-experiment-evidence
    paths:
      - "configs/transfer_28643153.json"
      - "scripts/run_transfer.py"
      - ".github/workflows/research-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frozen-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Scientific/software checks
        run: |
          pytest
          ruff check src tests scripts
          mypy src
      - name: Run frozen independent-domain transfer
        run: python scripts/run_transfer.py
      - name: Commit measured transfer results
        run: |
          git config user.name "sleep-fingerprint-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metrics/transfer_28643153 plots/transfer_28643153
          if git diff --cached --quiet; then
            echo "No generated transfer result changes"
          else
            git commit -m "results: reproduce frozen independent transfer"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
