name: qa-bootstrap

on:
  push:
    branches:
      - qa-fixes-20260908
    paths:
      - ".github/workflows/qa-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,encoder]"
          python -m pip install h5py
          python -m pip check
      - name: Freeze resolved dependencies
        run: |
          mkdir -p generated
          python -m pip freeze \
            | sed -e '/^-e /d' -e '/^sleep-fingerprint/d' -e 's/^torch==2\.14\.0+cpu$/torch==2.14.0/' \
            > generated/research-lock.txt
          test -s generated/research-lock.txt
      - name: Reproduce transfer package
        run: |
          python scripts/run_transfer.py \
            --output-dir generated/transfer-metrics \
            --plots-dir generated/transfer-plots
          test -s generated/transfer-metrics/age_predictions.csv
      - uses: actions/upload-artifact@v4
        with:
          name: qa-bootstrap-output
          if-no-files-found: error
          path: |
            generated/research-lock.txt
            generated/transfer-metrics/age_predictions.csv
