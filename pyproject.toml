[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sleep-fingerprint"
version = "0.1.0"
description = "Leakage-safe public BCG sleep fingerprint research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
encoder = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-requests>=2.31"]

[project.scripts]
sleep-fingerprint = "sleep_fingerprint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_fingerprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
